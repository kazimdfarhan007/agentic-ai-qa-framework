name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Typecheck & Unit/Eval Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Run MCP Server unit tests
        run: npm run test:mcp

      - name: Run Golden Dataset evaluation tests
        run: npm run test:ai-eval

      - name: Run Adversarial prompt injection tests
        run: npm run test:adversarial
